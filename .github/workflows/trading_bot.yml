name: 🤖 Swing Trading Bot (Full-Session Cloud + Weekend)

on:
  schedule:
    # 1. Luni - Vineri (Arhitectura Full-Session + Verificari Matinale/Seara):
    # Porneste in Pre-Market si ruleaza in sesiuni continue pana dupa inchiderea bursei (Raport End-of-Day).
    # Cu 'concurrency' activ, daca o sesiune ruleaza deja, nu este intrerupta, iar urmatoarea preia stafeta fara goluri!
    - cron: '10,40 13-22 * * 1-5'
    - cron: '15 7,10,12 * * 1-5'

    # 2. Weekend (Duminica la 16:00 UTC / 18:00-19:00 RO):
    # Reantreneaza modelul ML XGBoost, actualizeaza Watchlist-ul de lideri si trimite Raportul pe Telegram
    - cron: '0 16 * * 0'

  # Permite rularea manuala oricand cu 1 click din GitHub (de pe telefon sau PC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mod de rulare'
        required: true
        default: 'full_session'
        type: choice
        options:
          - full_session
          - scan_force
          - premarket_briefing
          - eod_report
          - weekend_maintenance

permissions:
  contents: write

concurrency:
  group: trading-bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 📥 Descarcare cod si stare curenta (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Configurare Python 3.11 + Cache librarii
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalare dependente
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executie Trading Bot (Full-Session / Comenzi Live Telegram)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'True' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_TRADE: ${{ secrets.AUTO_TRADE || 'False' }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 16 * * 0" ] || [ "${{ github.event.inputs.mode }}" = "weekend_maintenance" ]; then
            echo "🛠️ Rulare Mentenanta de Weekend & Pregatire Saptamana Noua..."
            python scheduler.py --weekend
          elif [ "${{ github.event.inputs.mode }}" = "premarket_briefing" ]; then
            echo "🌅 Trimitere Briefing Pre-Market..."
            python scheduler.py --premarket
          elif [ "${{ github.event.inputs.mode }}" = "eod_report" ]; then
            echo "🔔 Trimitere Raport Inchidere Bursa (End-of-Day)..."
            python scheduler.py --eod
          elif [ "${{ github.event.inputs.mode }}" = "scan_force" ]; then
            echo "🔎 Rulare Scanare Fortata + 90s Ascultare Telegram..."
            python scheduler.py --session --force
          else
            echo "📈 Rulare Sesiune Continua (~3.5h, scan la 15m, SL/TP la 60s, Telegram Live)..."
            python scheduler.py --session --max-minutes 215
          fi

      - name: 💾 Salvare stare persistenta (Jurnal, Pozitii, ML, Watchlist)
        if: always()
        run: |
          git config user.name "Trading Bot Cloud"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json data/*.pkl 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-sync bot state ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "ℹ️ Nicio modificare noua in fisierele de stare."
          fi
